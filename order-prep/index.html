<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Order Prep</title>

  <meta name="theme-color" content="#e31837">
  <meta name="application-name" content="Order Prep">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Order Prep">

  <link rel="manifest" href="./manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../DQ_Order_Prep_App_Icon_512.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="../DQ_Order_Prep_App_Icon_512.png"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f4f6f8;
    }

    #orderPrepApp {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6f8;
    }

    #installButton {
      position: fixed;
      right: 14px;
      bottom: 18px;
      z-index: 1000;
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #e31837;
      color: white;
      font: 800 14px Arial, sans-serif;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <iframe
    id="orderPrepApp"
    title="DQ Order Prep"
    src="https://script.google.com/macros/s/AKfycbz_bVpdglxuhj5wVmKQM3zQaksdEyk8LJZQCrPmAH6sWVzLYa-a_6aiomLj87DUnjRU6g/exec"
    allow="clipboard-write"
  ></iframe>

  <button id="installButton" type="button">
    Install Order Prep
  </button>

  <script>
    let installPrompt = null;
    const installButton = document.getElementById('installButton');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .catch(function (error) {
            console.error('Service worker registration failed:', error);
          });
      });
    }

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = 'block';
    });

    installButton.addEventListener('click', async function () {
      if (!installPrompt) return;

      installPrompt.prompt();
      await installPrompt.userChoice;

      installPrompt = null;
      installButton.style.display = 'none';
    });

    window.addEventListener('appinstalled', function () {
      installPrompt = null;
      installButton.style.display = 'none';
    });

    if (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true
    ) {
      installButton.style.display = 'none';
    }
  </script>
</body>
</html>
