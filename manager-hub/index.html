<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Manager Hub</title>

  <meta name="theme-color" content="#e31837">
  <meta name="application-name" content="Manager Hub">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Manager Hub">

  <link rel="manifest" href="./manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="../DQ_Manager_Hub_App_Icon_512_v2.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="../DQ_Manager_Hub_App_Icon_512_v2.png"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f4f6f8;
    }

    #managerHubApp {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6f8;
    }

    #installButton {
      position: fixed;
      right: 14px;
      bottom: 18px;
      z-index: 1000;
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #e31837;
      color: white;
      font: 800 14px Arial, sans-serif;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
    }
  </style>
</head>

<body>
  <iframe
    id="managerHubApp"
    title="DQ Manager Hub"
    src="https://script.google.com/macros/s/AKfycbx1n4u58fte_5N5Wgw-o7S6U2Mri6_1ZbasEPIz11i8GQsKWVrwN96ALlI7ABV3bmv91A/exec"
    allow="clipboard-write"
  ></iframe>

  <button id="installButton" type="button">
    Install Manager Hub
  </button>

  <script>
    let installPrompt = null;
    const installButton = document.getElementById('installButton');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .catch(function (error) {
            console.error(
              'Service worker registration failed:',
              error
            );
          });
      });
    }

    window.addEventListener(
      'beforeinstallprompt',
      function (event) {
        event.preventDefault();
        installPrompt = event;
        installButton.style.display = 'block';
      }
    );

    installButton.addEventListener(
      'click',
      async function () {
        if (!installPrompt) return;

        installPrompt.prompt();
        await installPrompt.userChoice;

        installPrompt = null;
        installButton.style.display = 'none';
      }
    );

    window.addEventListener('appinstalled', function () {
      installPrompt = null;
      installButton.style.display = 'none';
    });

    if (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true
    ) {
      installButton.style.display = 'none';
    }
  </script>
</body>
</html>
