<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Grill</title>

  <meta name="theme-color" content="#e31837">
  <meta name="application-name" content="Grill">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../DQ_Grill_App_Icon_512_v2.png">
  <link rel="apple-touch-icon" href="../DQ_Grill_App_Icon_512_v2.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #17212b;
    }

    .card {
      width: calc(100% - 32px);
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: #e31837;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="../DQ_Grill_App_Icon_512_v2.png" alt="Grill">
    <h1>Grill</h1>
    <p>DQ Grill Kitchen System</p>

    <a
      class="btn"
      href="https://script.google.com/macros/s/AKfycbxFq9bK0rWe12IGyRt-CLTXlWejiA7n1UV22lkNcaRUmXw7JXWyYhqVZFziSHx9G9oDfQ/exec">
      Open Grill
    </a>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
